server:
  port: 8082

spring:
  application:
    name: consumer-service

  # 1. 现代 Spring Cloud 要求的配置中心导入写法
  config:
    import:
      - optional:nacos:consumer-service.yaml

  cloud:
    nacos:
      # 2. 注册中心地址
      discovery:
        server-addr: localhost:8848

      # 3. 配置中心地址
      config:
        server-addr: localhost:8848
        file-extension: yaml
    loadbalancer:
      nacos:
        enabled: true

    # 4. Sentinel 核心配置（已为你加上 Nacos 持久化）
    sentinel:
      transport:
        # Sentinel 控制台地址（注意：你这里配的是 8858，请确保和实际启动的控制台端口一致）
        dashboard: localhost:8858
        # Client 与 Dashboard 沟通的端口
        port: 8719
      datasource:
        # 定义流控规则持久化到 Nacos
        flow:
          nacos:
            server-addr: localhost:8848
            data-id: ${spring.application.name}-sentinel-flow # 自动对应 consumer-service-sentinel-flow
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: flow # 规则类型：流控规则


management:
  tracing:
    sampling:
      probability: 1.0 # 采样率设为 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans # Zipkin 服务端上报地址

logging:
  level:
    root: INFO
    com.example: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [TraceId: %X{traceId}] - %msg%n"