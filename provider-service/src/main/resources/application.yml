server:
  port: 8081
rocketmq:
  name-server: localhost:9876
  producer:
    group: my-springboot-producer-group # 生产者组名
# 自定义文件导出路径配置
file:
  export:
    path: D:/excel_exports/  # Windows 示例
spring:
  application:
    name: provider-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/demo_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml # 指定 Mapper XML 文件路径
  configuration:
    # 开启驼峰命名自动转换（如数据库 create_time 自动映射为 Java 的 createTime）
    map-underscore-to-camel-case: true
management:
  tracing:
    sampling:
      probability: 1.0 # 采样率设为 1.0（100% 采集，方便我们在测试时每条请求都能在面板看到）
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans # Zipkin 服务端上报地址
logging:
  level:
    root: INFO
    # 打印你自定义包路径下的 DEBUG 级别日志（方便看鉴权、路由等详细过程）
    com.example: DEBUG
    # 确保 Micrometer Tracing 链路追踪的日志能够正常输出
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
  pattern:
    # 自定义日志打印格式：自动包含 %X{traceId}，这样每次打印日志时，都会把全局唯一 traceId 显式带上！
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [TraceId: %X{traceId}] - %msg%n"